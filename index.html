<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-mail Confirmado • FC Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #070b14;
            --card-bg: rgba(16, 24, 42, 0.75);
            --border-glow: rgba(0, 255, 133, 0.25);
            --accent-cyan: #00e5ff;
            --accent-green: #00ff85;
            --accent-purple: #8b5cf6;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        /* ==== Fundo estilo estádio ==== */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0, 255, 133, 0.2), transparent 60%),
                radial-gradient(ellipse 70% 50% at 100% 100%, rgba(139, 92, 246, 0.15), transparent 55%),
                radial-gradient(ellipse 70% 50% at 0% 100%, rgba(0, 229, 255, 0.12), transparent 55%);
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 255, 133, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 133, 0.06) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 80%);
            z-index: 1;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            from { background-position: 0 0, 0 0; }
            to   { background-position: 44px 44px, 44px 44px; }
        }

        /* ==== Luzes de estádio ==== */
        .stadium-lights {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .stadium-lights span {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.28;
            animation: floatLight 12s ease-in-out infinite;
        }

        .stadium-lights span:nth-child(1) {
            background: var(--accent-green);
            top: -250px;
            left: -150px;
        }

        .stadium-lights span:nth-child(2) {
            background: var(--accent-cyan);
            bottom: -250px;
            right: -150px;
            animation-delay: -4s;
        }

        .stadium-lights span:nth-child(3) {
            background: var(--accent-purple);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            opacity: 0.18;
            animation-delay: -8s;
        }

        @keyframes floatLight {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(30px, -30px) scale(1.1); }
        }

        /* ==== Confetes / partículas ==== */
        .confetti {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }

        .confetti span {
            position: absolute;
            width: 8px;
            height: 14px;
            top: -20px;
            opacity: 0;
            animation: confettiFall linear infinite;
        }

        .confetti span:nth-child(1)  { left: 5%;  background: var(--accent-cyan);   animation-duration: 4.5s; animation-delay: 0s; }
        .confetti span:nth-child(2)  { left: 15%; background: var(--accent-green);  animation-duration: 5.2s; animation-delay: 0.4s; }
        .confetti span:nth-child(3)  { left: 25%; background: var(--accent-purple); animation-duration: 4.8s; animation-delay: 0.9s; }
        .confetti span:nth-child(4)  { left: 38%; background: var(--accent-cyan);   animation-duration: 5.5s; animation-delay: 0.2s; }
        .confetti span:nth-child(5)  { left: 50%; background: var(--accent-green);  animation-duration: 4.2s; animation-delay: 1.3s; }
        .confetti span:nth-child(6)  { left: 62%; background: var(--accent-purple); animation-duration: 5s;   animation-delay: 0.6s; }
        .confetti span:nth-child(7)  { left: 74%; background: var(--accent-cyan);   animation-duration: 4.7s; animation-delay: 1.1s; }
        .confetti span:nth-child(8)  { left: 85%; background: var(--accent-green);  animation-duration: 5.3s; animation-delay: 0.3s; }
        .confetti span:nth-child(9)  { left: 92%; background: var(--accent-purple); animation-duration: 4.4s; animation-delay: 1.5s; }
        .confetti span:nth-child(10) { left: 45%; background: var(--accent-cyan);   animation-duration: 5.1s; animation-delay: 1.8s; }

        @keyframes confettiFall {
            0% {
                opacity: 0;
                transform: translateY(0) rotate(0deg);
            }
            10% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(105vh) rotate(720deg);
            }
        }

        /* ==== Card ==== */
        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 2.75rem 2.25rem 2.25rem;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.03) inset,
                0 25px 60px -15px rgba(0, 0, 0, 0.8),
                0 0 80px -20px rgba(0, 255, 133, 0.35);
            overflow: hidden;
            animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-cyan), var(--accent-purple));
            background-size: 200% 100%;
            animation: gradientShift 4s linear infinite;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 0; }
            100% { background-position: 200% 0; }
        }

        /* ==== Marca ==== */
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 0 24px rgba(0, 255, 133, 0.5);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 24px rgba(0, 255, 133, 0.5); }
            50%      { box-shadow: 0 0 40px rgba(0, 229, 255, 0.7); }
        }

        .brand-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 1.35rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 0%, var(--accent-green) 50%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ==== Ícone de sucesso ==== */
        .success-icon-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 1.75rem;
            position: relative;
        }

        .success-icon {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(0, 255, 133, 0.35), rgba(0, 229, 255, 0.1));
            border: 2px solid rgba(0, 255, 133, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: iconPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
        }

        @keyframes iconPop {
            0%   { transform: scale(0); opacity: 0; }
            60%  { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); }
        }

        .success-icon::before {
            content: "";
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 133, 0.3);
            animation: ripple 2.5s ease-out infinite;
        }

        .success-icon::after {
            content: "";
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid rgba(0, 229, 255, 0.3);
            animation: ripple 2.5s ease-out infinite 1.25s;
        }

        @keyframes ripple {
            0%   { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        .success-icon svg {
            width: 48px;
            height: 48px;
            stroke: var(--accent-green);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            filter: drop-shadow(0 0 10px rgba(0, 255, 133, 0.9));
        }

        .success-icon svg polyline {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: drawCheck 0.6s ease-out 0.9s forwards;
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        /* ==== Textos ==== */
        .card h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.55rem;
            font-weight: 800;
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 0.65rem;
            background: linear-gradient(135deg, #ffffff, #a7ffd4);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card p.subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.75rem;
            padding: 0 0.5rem;
        }

        .card p.subtitle strong {
            color: var(--accent-green);
            font-weight: 600;
        }

        /* ==== Badge de status ==== */
        .status-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: rgba(0, 255, 133, 0.08);
            border: 1px solid rgba(0, 255, 133, 0.3);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            margin-bottom: 1.75rem;
            font-size: 0.85rem;
            color: var(--accent-green);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-badge svg {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            stroke: var(--accent-green);
            stroke-width: 2.5;
            fill: none;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 12px var(--accent-green);
            animation: dotPulse 1.5s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.6; transform: scale(0.85); }
        }

        /* ==== Estatísticas rápidas ==== */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.75rem;
        }

        .stat {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 0.9rem 0.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat:hover {
            border-color: rgba(0, 255, 133, 0.3);
            background: rgba(0, 255, 133, 0.05);
            transform: translateY(-2px);
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--accent-green);
            margin-bottom: 0.2rem;
        }

        .stat-label {
            font-size: 0.68rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* ==== Botões ==== */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            padding: 0.95rem 1.5rem;
            border: none;
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .btn svg {
            width: 18px;
            height: 18px;
            transition: transform 0.3s ease;
        }

        /* Botão primário */
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            color: #04121a;
            box-shadow: 0 8px 24px -6px rgba(0, 255, 133, 0.5);
        }

        .btn-primary::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
            transition: left 0.6s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 32px -6px rgba(0, 255, 133, 0.7);
        }

        .btn-primary:hover svg {
            transform: translateX(4px);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        /* Botão secundário */
        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 255, 133, 0.4);
            transform: translateY(-2px);
            color: var(--accent-green);
        }

        /* ==== Rodapé ==== */
        .footer-note {
            margin-top: 1.75rem;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .footer-note a {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .footer-note a:hover {
            color: var(--accent-green);
            text-decoration: underline;
        }

        /* ==== Responsivo ==== */
        @media (max-width: 520px) {
            .card {
                padding: 2rem 1.5rem 1.75rem;
                border-radius: 20px;
            }
            .card h1 {
                font-size: 1.25rem;
            }
            .success-icon {
                width: 84px;
                height: 84px;
            }
            .success-icon svg {
                width: 40px;
                height: 40px;
            }
            .brand-text {
                font-size: 1.15rem;
            }
            .stat-value {
                font-size: 1.05rem;
            }
            .stat-label {
                font-size: 0.6rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- Luzes de estádio -->
    <div class="stadium-lights">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Confetes -->
    <div class="confetti" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- Card principal -->
    <main class="card" role="main">

        <!-- Marca -->
        <div class="brand">
            <div class="brand-icon">⚽</div>
            <div class="brand-text">FC ARENA</div>
        </div>

        <!-- Ícone de sucesso animado -->
        <div class="success-icon-wrap">
            <div class="success-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </div>
        </div>

        <!-- Título -->
        <h1>E-MAIL CONFIRMADO!</h1>
        <p class="subtitle">
            Boas-vindas ao time, craque! 🎉<br>
            Sua conta no <strong>FC Arena</strong> está ativa e pronta para registrar suas partidas.
        </p>

        <!-- Badge de status -->
        <div class="status-badge">
            <span class="status-dot"></span>
            Conta verificada com sucesso
        </div>

        <!-- Estatísticas -->
        <div class="stats" aria-label="Estatísticas da conta">
            <div class="stat">
                <div class="stat-value">0</div>
                <div class="stat-label">Partidas</div>
            </div>
            <div class="stat">
                <div class="stat-value">0</div>
                <div class="stat-label">Vitórias</div>
            </div>
            <div class="stat">
                <div class="stat-value">--</div>
                <div class="stat-label">Ranking</div>
            </div>
        </div>

        <!-- Botões -->
        <div class="btn-group">
            <a href="/dashboard" class="btn btn-primary" id="enterBtn">
                ENTRAR NO CAMPO
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                    <polyline points="12 5 19 12 12 19"/>
                </svg>
            </a>

            <a href="/perfil" class="btn btn-secondary" id="profileBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                COMPLETAR PERFIL
            </a>
        </div>

        <p class="footer-note">
            Precisa de ajuda? <a href="/suporte">Fale com o suporte</a>
        </p>
    </main>

    <script>
        // Pega o e-mail da URL (?email=...) e personaliza o subtítulo (opcional)
        (function () {
            const params = new URLSearchParams(window.location.search);
            const email = params.get('email');
            if (email) {
                const subtitle = document.querySelector('.card p.subtitle');
                subtitle.innerHTML = `Boas-vindas ao time, craque! 🎉<br>
                    <strong>${decodeURIComponent(email)}</strong> está confirmado e pronto para jogar.`;
            }
        })();

        // Feedback de clique no botão principal
        document.getElementById('enterBtn').addEventListener('click', function (e) {
            // Se você quiser apenas simular o clique visualmente:
            this.style.transform = 'scale(0.97)';
            setTimeout(() => {
                this.style.transform = '';
            }, 150);
            // Redirecione conforme sua rota real:
            // e.preventDefault(); window.location.href = '/dashboard';
        });
    </script>
</body>
</html>
